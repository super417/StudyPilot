# StudyPilot - Nginx site config
# HTTPS uses a Let's Encrypt IP-address certificate (shortlived profile, ~6 days).
# Renewal: certbot renew --deploy-hook "systemctl reload nginx" (cron, twice a day).
# When you move to a real domain, replace the certificate paths below, then
# switch this server_name and re-issue with --domain.

# HTTP: serve ACME challenges only, send everything else to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    root /srv/studypilot/frontend/dist;
    index index.html;

    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/8.137.203.9/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.137.203.9/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Intentionally no HSTS: the IP certificate renews every ~6 days, and a
    # long-lived HSTS policy would lock users out if renewal ever fails.

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml
        application/manifest+json;

    # FastAPI: keep SSE unbuffered for AI chat streaming.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite hashed assets, with fallback to the embedded resume app assets.
    location ^~ /assets/ {
        try_files $uri @resume_site_asset;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /fonts/ {
        try_files $uri @resume_site_asset;
        expires 30d;
    }

    location ^~ /landing/ {
        try_files $uri @resume_site_asset;
        expires 30d;
    }

    location ^~ /template-snapshots/ {
        try_files $uri @resume_site_asset;
        expires 30d;
    }

    location ^~ /resume-site/ {
        try_files $uri $uri/index.html =404;
        expires 30d;
    }

    # The embedded resume app references these from the site root.
    location = /logo.svg {
        try_files /resume-site/logo.svg =404;
        expires 30d;
    }

    location = /icon.png {
        try_files /resume-site/icon.png =404;
        expires 30d;
    }

    location = /favicon.ico {
        try_files /resume-site/favicon.ico =404;
        expires 30d;
    }

    # Preview screenshot used by the resume landing page (absolute /web-shot.png).
    location = /web-shot.png {
        try_files /resume-site/web-shot.png =404;
        expires 30d;
    }

    location = /avatar.png {
        try_files /resume-site/avatar.png =404;
        expires 30d;
    }

    # Magic Resume mirrors extensionless routes under /resume-site.
    location = /zh {
        try_files /resume-site/zh/index.html =404;
    }

    location = /en {
        try_files /resume-site/en/index.html =404;
    }

    location = /zh/ {
        try_files /resume-site/zh/index.html =404;
    }

    location = /en/ {
        try_files /resume-site/en/index.html =404;
    }

    location ^~ /app/workbench/ {
        try_files /resume-site/app/workbench/index.html =404;
    }

    location ^~ /app/preview-template/ {
        try_files /resume-site/app/preview-template/index.html =404;
    }

    location ^~ /app/ {
        try_files $uri $uri/index.html /resume-site/app/dashboard/index.html =404;
    }

    location @resume_site_asset {
        try_files /resume-site$uri =404;
    }

    # Do not cache the SPA entry; hashed assets are cached above.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Cache images, fonts, videos and Rive assets after the first visit.
    location ~* \.(?:webp|avif|png|jpe?g|gif|svg|ico|woff2?|mp4|webm|riv|wasm)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
